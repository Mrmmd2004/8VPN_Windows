name: Build Windows

on:
  workflow_dispatch:
    inputs:
      aether_ref:
        description: "Aether release tag"
        default: "v2.3.0"
      singbox_version:
        description: "sing-box version (without v)"
        default: "1.13.21"
  push:
    tags: ["v*"]

env:
  AETHER_REF: ${{ inputs.aether_ref || 'v2.3.0' }}
  SINGBOX_VERSION: ${{ inputs.singbox_version || '1.13.21' }}
  WINTUN_VERSION: "0.14.1"
  APP_VERSION: "2.8"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        shell: bash
        run: pip install -r requirements.txt pyinstaller

      - name: Download cores (Aether + pt, sing-box, Wintun)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/prepare_core.py

      # Opens every page offscreen and saves screenshots. A failure here does not stop the build,
      # but the log shows the exact Python error.
      - name: UI smoke test and screenshots
        continue-on-error: true
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_test.py

      - name: Build folder version
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --uac-admin --name 8VPN \
            --icon assets/icon.ico --add-data "assets;assets" \
            --exclude-module tkinter --exclude-module PyQt6.QtNetwork \
            --exclude-module PyQt6.QtSvg --exclude-module PyQt6.QtQml \
            main.py
          cp -r core dist/8VPN/core
          cp README.md LICENSE dist/8VPN/
          ls -la dist/8VPN

      - name: Build portable single-file exe
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --uac-admin --name 8VPN-Portable \
            --icon assets/icon.ico --add-data "assets;assets" --add-data "core;core" \
            --exclude-module tkinter --exclude-module PyQt6.QtNetwork \
            --exclude-module PyQt6.QtSvg --exclude-module PyQt6.QtQml \
            --distpath dist-portable --workpath build-portable \
            main.py
          ls -la dist-portable

      - name: Build setup installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem installer

      - name: Collect files
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if (Test-Path dist/8VPN) { Compress-Archive -Path dist/8VPN -DestinationPath out/8VPN-Windows-x64.zip -Force }
          if (Test-Path dist-portable/8VPN-Portable.exe) { Copy-Item dist-portable/8VPN-Portable.exe out/ }
          if (Test-Path installer/8VPN-Setup.exe) { Copy-Item installer/8VPN-Setup.exe out/ }
          Get-ChildItem out

      - name: Upload Setup
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: 8VPN-Setup
          path: out/8VPN-Setup.exe
          if-no-files-found: warn

      - name: Upload Portable
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: 8VPN-Portable
          path: out/8VPN-Portable.exe
          if-no-files-found: warn

      - name: Upload Zip
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: 8VPN-Windows-zip
          path: out/8VPN-Windows-x64.zip
          if-no-files-found: warn

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-preview
          path: preview/*.png
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
